<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva solicitud - NTEK ServiceDesk Lite</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/componentes.css">
</head>

<body class="verificando">
  <div class="pantalla-carga">Cargando...</div>

  <div id="header-placeholder"></div>

  <main class="contenedor">
    <div class="tarjeta">
      <h1>Nueva solicitud</h1>

      <form id="form-nueva-solicitud">
        <div class="form-grupo">
          <label for="titulo">Título</label>
          <input type="text" id="titulo" name="titulo" required>
        </div>

        <div class="form-grupo">
          <label for="categoria">Categoría</label>
          <select id="categoria" name="categoria" required>
            <option value="">Selecciona una categoría</option>
            <option value="Software">Software</option>
            <option value="Hardware">Hardware</option>
            <option value="Red">Red</option>
            <option value="Cuenta">Cuenta</option>
          </select>
        </div>

        <div class="form-grupo">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" name="descripcion" rows="4" required></textarea>
        </div>

        <div class="form-grupo">
          <label for="prioridad">Prioridad sugerida</label>
          <select id="prioridad" name="prioridad" required>
            <option value="">Selecciona una prioridad</option>
            <option value="baja">Baja</option>
            <option value="media">Media</option>
            <option value="alta">Alta</option>
            <option value="critica">Crítica</option>
          </select>
        </div>

        <button type="submit" class="boton">Enviar solicitud</button>
      </form>
    </div>
  </main>

  <script type="module" src="../../js/nueva-solicitud.js"></script>

</body>

</html>
