<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña - NTEK ServiceDesk Lite</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/componentes.css">
  <link rel="stylesheet" href="../../css/publicas.css">
</head>

<body class="pagina-publica">

  <header class="header header-publico">
    <a class="logo" href="../../index.html" aria-label="NTEK ServiceDesk Lite, inicio">
      <span class="logo-marca"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg></span>
      <span class="logo-texto">NTEK <small>ServiceDesk Lite</small></span>
    </a>
    <nav class="nav-publica" aria-label="Principal">
      <a href="login.html">Iniciar sesión</a>
      <a href="registro.html" class="boton-pildora boton-pildora--acento">Crear cuenta</a>
    </nav>
  </header>

  <main class="contenedor-acceso">
    <div class="tarjeta-acceso">
      <p class="eyebrow">Recuperación de acceso</p>
      <h1>Recuperar contraseña</h1>
      <p class="subtitulo">Te ayudamos a crear una contraseña nueva para tu cuenta.</p>

      <p id="mensaje"></p>

      <form id="form-solicitar">
        <div class="form-grupo">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" autocomplete="email" required>
        </div>

        <button type="submit" class="boton">Enviar enlace</button>
      </form>

      <form id="form-nueva-password" hidden>
        <div class="form-grupo">
          <label for="nueva-password">Nueva contraseña</label>
          <input type="password" id="nueva-password" name="nueva-password" autocomplete="new-password" required>
        </div>

        <div class="form-grupo">
          <label for="confirmar-nueva-password">Confirmar nueva contraseña</label>
          <input type="password" id="confirmar-nueva-password" name="confirmar-nueva-password" autocomplete="new-password" required>
        </div>

        <button type="submit" class="boton">Guardar nueva contraseña</button>
      </form>

      <p class="acceso-enlaces">¿Recordaste tu contraseña? <a href="login.html">Inicia sesión</a></p>
    </div>
  </main>

  <script type="module" src="../../js/recuperar.js"></script>

</body>

</html>
