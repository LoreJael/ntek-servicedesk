<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - NTEK ServiceDesk Lite</title>
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/componentes.css">
</head>

<body>

    <header class="header">
        <p class="logo">NTEK ServiceDesk Lite</p>
        <nav class="nav-principal" aria-label="Principal">
            <a href="login.html">Iniciar sesión</a>
            <a href="registro.html">Registrarse</a>
        </nav>
    </header>

    <main class="contenedor">
        <div class="tarjeta">

            <h1>Recuperar Contraseña</h1>

              <p id="mensaje"></p>

            <form id="form-solicitar">
                <div class="form-grupo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" required>
                </div>

                <button type="submit" class="boton">Recuperar Contraseña</button>
            </form>

             <form id="form-nueva-password" hidden>
                <div class="form-grupo">
                    <label for="nueva-password">Nueva contraseña</label>
                    <input type="password" id="nueva-password" name="nueva-password" required>
                </div>

                <div class="form-grupo">
                    <label for="confirmar-nueva-password">Confirmar nueva contraseña</label>
                    <input type="password" id="confirmar-nueva-password" name="confirmar-nueva-password" required>
                </div>

                <button type="submit" class="boton">Guardar nueva contraseña</button>
            </form>

            <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>

        </div>
    </main>

    <script type="module" src="../../js/recuperar.js"></script>

</body>

</html>
