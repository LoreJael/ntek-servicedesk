<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - NTEK ServiceDesk Lite</title>
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/componentes.css">
</head>

<body>

    <header class="header">
        <p class="logo">NTEK ServiceDesk Lite</p>
        <nav class="nav-principal" aria-label="Principal">
            <a href="login.html">Iniciar sesión</a>
            <a href="registro.html">Registrarse</a>
        </nav>
    </header>

    <main class="contenedor">
        <div class="tarjeta">

            <h1>Registrarse</h1>

            <form id="form-registro">
                <div class="form-grupo">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="form-grupo">
                    <label for="empresa">Empresa</label>
                    <input type="text" id="empresa" name="empresa" required>
                </div>

                <div class="form-grupo">
                    <label for="telefono">Telefono</label>
                    <input type="tel" id="telefono" name="telefono" required>
                </div>

                <div class="form-grupo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" required>
                </div>

                <div class="form-grupo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-grupo">
                    <label for="confirmar-password">Confirmar Contraseña</label>
                    <input type="password" id="confirmar-password" name="confirmar-password" required>
                </div>

                <button type="submit" class="boton">Crear Cuenta</button>

                <p id="mensaje"></p>

            </form>

            <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>

        </div>
    </main>

    <script type="module" src="../../js/registro.js"></script>
    
</body>

</html>
