<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de ticket - NTEK ServiceDesk Lite</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/componentes.css">
</head>

<body class="verificando">
  <div class="pantalla-carga">Cargando...</div>

  <div id="header-placeholder"></div>

  <main class="contenedor">
    <div class="detalle-layout detalle-layout--equipo">
      <section class="detalle-ticket-seccion">
        <div class="tarjeta" id="detalle-ticket"></div>
      </section>

      <section class="gestion-ticket-seccion">
        <div class="tarjeta" id="gestion-ticket"></div>
      </section>

      <section class="tarjeta adjuntos-ticket">
        <h2>Archivos adjuntos</h2>
        <ul class="lista-adjuntos" id="lista-adjuntos"></ul>

        <form id="form-adjunto" hidden>
          <div class="form-grupo">
            <label for="input-adjunto">Adjuntar archivo (JPG, PNG o PDF, máximo 5 MB)</label>
            <input type="file" id="input-adjunto" accept="image/jpeg, image/png, application/pdf">
          </div>
          <button type="submit" class="boton">Subir archivo</button>
        </form>
      </section>

      <section class="comentarios-ticket-seccion">
        <h2>Comentarios</h2>
        <ul class="lista-comentarios" id="lista-comentarios-ticket"></ul>

        <form id="form-comentario" hidden>
          <div class="form-grupo">
            <label for="texto-comentario">Escribe una respuesta o nota</label>
            <textarea id="texto-comentario" rows="4"></textarea>
          </div>
          <div class="form-grupo form-grupo--casilla">
            <label>
              <input type="checkbox" id="casilla-interna">
              Nota interna (el cliente no la ve)
            </label>
          </div>
          <button type="submit" class="boton">Enviar comentario</button>
        </form>
      </section>
    </div>
  </div>
  
  </main>

  <script type="module" src="../../js/detalle-ticket-equipo.js"></script>

</body>

</html>
