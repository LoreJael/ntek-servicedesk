<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandeja global — NTEK ServiceDesk Lite</title>
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/componentes.css">
</head>

<body class="verificando">
    <div class="pantalla-carga">Cargando...</div>

    <div id="header-placeholder"></div>

    <main>
        <h1>Bandeja global</h1>

        <section class="filtros">
            <input type="search" id="filtro-texto" placeholder="Buscar por título" aria-label="Buscar por título">

            <select id="filtro-estado" aria-label="Filtrar por estado">
                <option value="">Todos los estados</option>
                <option value="nuevo">Nuevo</option>
                <option value="en_revision">En revisión</option>
                <option value="en_progreso">En progreso</option>
                <option value="en_espera">En espera</option>
                <option value="resuelto">Resuelto</option>
                <option value="cerrado">Cerrado</option>
            </select>

            <select id="filtro-prioridad" aria-label="Filtrar por prioridad">
                <option value="">Todas las prioridades</option>
                <option value="baja">Baja</option>
                <option value="media">Media</option>
                <option value="alta">Alta</option>
                <option value="critica">Crítica</option>
            </select>

            <select id="filtro-categoria" aria-label="Filtrar por categoría">
                <option value="">Todas las categorías</option>
                <option value="Red">Red</option>
                <option value="Hardware">Hardware</option>
                <option value="Software">Software</option>
            </select>
        </section>

        <section>
            <ul id="lista-tickets"></ul>
        </section>
    </main>

    <script type="module" src="../../js/bandeja-global.js"></script>
</body>

</html>
