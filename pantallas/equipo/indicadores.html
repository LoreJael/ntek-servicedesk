<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indicadores — NTEK ServiceDesk Lite</title>
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/componentes.css">
</head>

<body class="verificando">
    <div class="pantalla-carga">Cargando...</div>

    <div id="header-placeholder"></div>

    <main class="contenedor">

        <div class="encabezado-pagina">
            <p class="eyebrow">Equipo NTEK</p>
            <h1>Indicadores</h1>
            <p class="subtitulo">Resumen de los tickets que puedes gestionar. Haz clic en un indicador para ver la lista filtrada.</p>
        </div>

        <div id="indicadores-contenido">

            <div class="fila-secciones">
                <section class="tarjeta-seccion">
                    <div class="tarjeta-seccion-cabecera">
                        <p class="eyebrow">Distribución</p>
                        <h2>Tickets por estado</h2>
                    </div>
                    <div class="tarjeta-seccion-cuerpo">
                        <div class="resumen-estados" id="resumen-por-estado"></div>
                    </div>
                </section>

                <section class="tarjeta-seccion">
                    <div class="tarjeta-seccion-cabecera">
                        <p class="eyebrow">Urgencia</p>
                        <h2>Tickets por prioridad</h2>
                    </div>
                    <div class="tarjeta-seccion-cuerpo">
                        <div class="resumen-estados" id="resumen-por-prioridad"></div>
                    </div>
                </section>
            </div>

            <section class="tarjeta-seccion">
                <div class="tarjeta-seccion-cabecera">
                    <p class="eyebrow">Atención inmediata</p>
                    <h2>Alta prioridad abiertos</h2>
                </div>
                <div class="tarjeta-seccion-cuerpo">
                    <div id="lista-alta-prioridad"></div>
                </div>
            </section>

            <section class="tarjeta-seccion">
                <div class="tarjeta-seccion-cabecera">
                    <p class="eyebrow">Actividad</p>
                    <h2>Casos recientes</h2>
                </div>
                <div class="tarjeta-seccion-cuerpo">
                    <div id="lista-recientes"></div>
                </div>
            </section>

        </div>

    </main>

    <script type="module" src="../../js/indicadores.js"></script>
</body>

</html>
